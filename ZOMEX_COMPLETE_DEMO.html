<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZOMEX Private Portal</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#171717;font-family:Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}
.hidden{display:none!important}.top{height:64px;background:#111;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:9}
.logo{font-size:24px;font-weight:900;letter-spacing:2px}.btn{padding:10px 14px;border-radius:9px;font-weight:700}.red{background:#d71920;color:#fff}.dark{background:#111;color:#fff}.light{background:#eee}
.login{max-width:390px;margin:55px auto;background:#fff;padding:30px;border-radius:18px;box-shadow:0 10px 35px #0001}.login input,.search,.field{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;margin:7px 0}.full{width:100%}
.wrap{max-width:1150px;margin:auto;padding:18px}.welcome{font-size:22px;font-weight:800;margin-bottom:14px}
.cats{display:flex;gap:8px;overflow:auto;margin:12px 0}.cat{background:#eee;border-radius:20px;padding:9px 14px;white-space:nowrap}.active{background:#d71920;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card,.panel{background:#fff;border-radius:15px;padding:16px;box-shadow:0 3px 15px #0000000b}
.type{font-size:12px;color:#777;margin-top:6px}.price{font-size:21px;font-weight:800;margin:10px 0}.qty{display:flex;justify-content:space-between;align-items:center;border:1px solid #ddd;border-radius:9px;padding:5px}.qty button{width:36px;height:36px;border-radius:7px;background:#eee;font-size:20px}
.add{width:100%;margin-top:10px}.note{background:#fff4d8;padding:12px;border-radius:10px;margin:12px 0;font-size:13px}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:14px}
.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;align-items:center;margin:8px 0}
.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button.active{background:#d71920;color:#fff}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:20;padding:15px}.modalbox{background:#fff;border-radius:15px;padding:20px;width:min(650px,100%);max-height:90vh;overflow:auto}
.cartbox{position:fixed;right:15px;bottom:15px;background:#111;color:#fff;padding:14px 18px;border-radius:12px;z-index:10}
@media(max-width:700px){.row{grid-template-columns:1fr 1fr}}
</style></head><body>

<div id="login" class="login">
<div class="logo">ZOMEX</div><h1>Welcome Back</h1><p style="color:#777">Private customer portal</p>
<input id="loginUser" placeholder="Username"><input id="loginPass" type="password" placeholder="Password">
<button class="btn red full" onclick="doLogin()">SIGN IN</button>
<p style="font-size:12px;color:#777">Customer demo: <b>hemant / 1234</b><br>Admin demo: <b>admin / admin123</b></p>
</div>

<div id="site" class="hidden">
<header class="top"><div class="logo">ZOMEX</div><div><button id="cartBtn" class="btn red" onclick="openCart()">🛒 Cart (0)</button> <button class="btn light" onclick="logout()">Logout</button></div></header>

<section id="customerPage" class="wrap">
<div id="welcome" class="welcome"></div>
<input id="search" class="search" placeholder="🔍 Search model..." oninput="renderProducts()">
<div id="cats" class="cats"></div>
<div class="note">🔒 Stock is hidden from customers. Quantity is <b>unlimited</b>.</div>
<div id="grid" class="grid"></div>
</section>

<section id="adminPage" class="wrap hidden">
<h2>Admin Dashboard</h2>
<div class="tabs"><button class="btn active" onclick="adminTab('products',this)">Products</button><button class="btn" onclick="adminTab('customers',this)">Customers</button><button class="btn" onclick="adminTab('orders',this)">Orders</button></div>
<div id="adminContent"></div>
</section>
</div>

<div id="modal" class="modal hidden"><div class="modalbox" id="modalBox"></div></div>
<div id="toast" class="cartbox hidden"></div>

}
function logout(){location.reload()}
function buildCats(){
 const cats=["ALL",...new Set(products.map(p=>p.cat))]; catsEl=cats;
 document.getElementById("cats").innerHTML=cats.map((x,i)=>`<button class="cat ${i===0?"active":""}" onclick="setCat('${esc(x)}',this)">${x}</button>`).join("");
}
function setCat(c,b){currentCat=c;document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderProducts()}
function renderProducts(){
 const q=(search.value||"").toLowerCase();
 const a=products.filter(p=>(currentCat==="ALL"||p.cat===currentCat)&&p.name.toLowerCase().includes(q));
 grid.innerHTML=a.map(p=>{
  const n=cart[p.name]?.qty||1;
  return `<div class="card"><b>${esc(p.name)}</b><div class="type">${esc(p.cat)}</div><div class="price">₹${p.price}</div>
  <div class="qty"><button onclick="changeQty('${js(p.name)}',-1)">−</button><b>${n}</b><button onclick="changeQty('${js(p.name)}',1)">+</button></div>
  <button class="btn dark add" onclick="addToCart('${js(p.name)}')">ADD TO CART</button></div>`;
 }).join("");
}
function changeQty(n,d){cart[n]=cart[n]||{qty:1};cart[n].qty=Math.max(1,cart[n].qty+d);renderProducts()}
function addToCart(n){cart[n]=cart[n]||{qty:1};updateCart();toast("Added to cart")}
function updateCart(){let n=Object.values(cart).reduce((s,x)=>s+x.qty,0);cartBtn.textContent="🛒 Cart ("+n+")"}
function openCart(){
 let keys=Object.keys(cart);
 if(!keys.length)return alert("Cart is empty");
 let total=0;let rows=keys.map(n=>{let p=products.find(x=>x.name===n),q=cart[n].qty,t=p.price*q;total+=t;return `<tr><td>${esc(n)}</td><td>${q}</td><td>₹${t}</td></tr>`}).join("");
 modalBox.innerHTML=`<h2>🛒 Your Cart</h2><table class="table"><tr><th>Product</th><th>Qty</th><th>Total</th></tr>${rows}</table><h3>Total: ₹${total}</h3><button class="btn red" onclick="placeOrder()">PLACE ORDER</button> <button class="btn light" onclick="closeModal()">Close</button>`;
 modal.classList.remove("hidden");
}
function placeOrder(){
 let items=Object.entries(cart).map(([name,x])=>{let p=products.find(a=>a.name===name);return {name,qty:x.qty,rate:p.price,total:p.price*x.qty}});
 let total=items.reduce((s,x)=>s+x.total,0),id=1001+orders.length;
 orders.push({id,customer:current.name,username:current.username,items,total,status:"Pending",date:new Date().toLocaleString()});
 cart={};updateCart();closeModal();toast("Order #"+id+" placed");
}
function adminTab(tab,btn){
 document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active")); if(btn)btn.classList.add("active");
 if(tab==="products")renderAdminProducts(); if(tab==="customers")renderCustomers(); if(tab==="orders")renderOrders();
}
function renderAdminProducts(){
 adminContent.innerHTML=`<div class="panel"><h3>Add Product</h3><div class="row"><input id="pn" class="field" placeholder="Product name"><input id="pc" class="field" placeholder="Category"><input id="pp" class="field" type="number" placeholder="Rate"><input id="ps" class="field" type="number" placeholder="Stock"><button class="btn red" onclick="addProduct()">ADD</button></div></div>
 <div class="panel"><h3>Products (customer never sees stock)</h3>${products.map((p,i)=>`<div class="row"><b>${esc(p.name)}</b><span>₹${p.price}</span><span>Stock: ${p.stock??0}</span><button class="btn light" onclick="editProduct(${i})">Edit</button><button class="btn red" onclick="deleteProduct(${i})">Delete</button></div>`).join("")}</div>`;
}
function addProduct(){
 let name=pn.value.trim(),cat=pc.value.trim()||"OTHER",price=+pp.value||50,stock=+ps.value||0;if(!name)return alert("Product name required");
 products.push({name,cat,price,stock});renderAdminProducts();
}
function editProduct(i){let p=products[i],price=prompt("Rate",p.price),stock=prompt("Internal stock",p.stock??0);if(price!==null)p.price=+price||p.price;if(stock!==null)p.stock=+stock||0;renderAdminProducts()}
function deleteProduct(i){if(confirm("Delete product?")){products.splice(i,1);renderAdminProducts()}}
function renderCustomers(){
 adminContent.innerHTML=`<div class="panel"><h3>Add Customer</h3><div class="row"><input id="cn" class="field" placeholder="Customer name"><input id="cu" class="field" placeholder="Username"><input id="cp" class="field" placeholder="Password"><button class="btn red" onclick="addCustomer()">ADD</button></div></div>
 <div class="panel"><h3>Customers</h3>${customers.map((c,i)=>`<div class="row"><b>${esc(c.name)}</b><span>${c.username}</span><span>${c.active?"🟢 Active":"🔴 Disabled"}</span><button class="btn light" onclick="toggleCustomer(${i})">${c.active?"Disable":"Enable"}</button><button class="btn red" onclick="deleteCustomer(${i})">Delete</button></div>`).join("")}</div>`;
}
function addCustomer(){let name=cn.value.trim(),u=cu.value.trim(),p=cp.value;if(!name||!u||!p)return alert("Fill all fields");if(customers.some(x=>x.username===u))return alert("Username exists");customers.push({name,username:u,password:p,active:true});renderCustomers()}
function toggleCustomer(i){customers[i].active=!customers[i].active;renderCustomers()}
function deleteCustomer(i){if(confirm("Delete customer?")){customers.splice(i,1);renderCustomers()}}
function renderOrders(){
 adminContent.innerHTML=`<div class="panel"><h3>Orders</h3>${orders.length?orders.map(o=>`<div class="panel"><b>Order #${o.id}</b> — ${esc(o.customer)} — ${o.date}<br><small>${o.items.map(x=>esc(x.name)+" × "+x.qty).join(" | ")}</small><h4>₹${o.total} — ${o.status}</h4></div>`).join(""):"No orders yet."}</div>`;
}
function closeModal(){modal.classList.add("hidden")}
function toast(t){toastEl=document.getElementById("toast");toastEl.textContent=t;toastEl.classList.remove("hidden");setTimeout(()=>toastEl.classList.add("hidden"),1800)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function js(s){return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'")}
</script></body></html>
